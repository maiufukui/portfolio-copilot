# Render Blueprint -- deploys both services from one file via
# Render dashboard > New > Blueprint (select this repo, Render finds
# this automatically).
#
# Two services, matching how this project is actually structured
# (server.py wraps app/graph.py; frontend/ is a separate Next.js app
# that calls it over HTTP -- see server.py and frontend/lib/api.ts):
#   1. portfolio-copilot-backend  -- FastAPI, Python
#   2. portfolio-copilot-frontend -- Next.js, Node
#
# Secrets (sync: false) are NOT in this file and never will be -- Render
# prompts for them once, in the dashboard, when you deploy this
# Blueprint. Get the values from this repo's local .env (never commit
# that file -- it's already in .gitignore).

services:
  # Python version is pinned via .python-version (repo root, "3.12") --
  # NOT here. Render's default runtime is newer than what tiktoken==0.9.0
  # has a prebuilt wheel for; without pinning, pip tries to compile it
  # from source on Render's build image and fails (confirmed via a real
  # failed deploy: "Failed to build installable wheels ... tiktoken").
  # 3.12 matches this repo's local .venv exactly, where it's already
  # proven to work.
  - type: web
    name: portfolio-copilot-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-server.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      # Render Postgres -- required as of app/db.py. server.py's
      # _check_env() fails the service at startup (SystemExit) if this
      # is missing, same hard-requirement status as the three keys
      # above. Replaces FMP_API_KEY, which is fully dead now (grepped:
      # zero references left in app/tools.py outside a historical
      # comment) -- FMP was confirmed gated (402 on ALAB) and never
      # became the real price-history source; Postgres did.
      - key: DATABASE_URL
        sync: false
      # Optional -- LangSmith tracing works without these too.
      - key: LANGSMITH_TRACING
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      # Separate LangSmith project from local dev, on purpose. graph.py
      # sets this via os.environ.setdefault("LANGSMITH_PROJECT",
      # "portfolio-copilot") -- setdefault only applies its value if the
      # env var isn't already set. Locally, nothing sets LANGSMITH_PROJECT
      # (not in .env), so local runs fall back to "portfolio-copilot".
      # Here, setting it explicitly (not a secret, just a label -- hence
      # a plain `value`, not `sync: false`) makes production traces land
      # in their own "portfolio-copilot-prod" project instead, so a
      # deployed user's chat doesn't mix into the same trace history as
      # local dev testing.
      - key: LANGSMITH_PROJECT
        value: portfolio-copilot-prod

  - type: web
    name: portfolio-copilot-frontend
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start -- -p $PORT
    envVars:
      # Deliberately sync: false rather than fromService: property: host.
      # Render subdomains are globally unique across all Render accounts,
      # so "portfolio-copilot-backend" may not be the backend's actual
      # final hostname if that name is already taken by someone else --
      # sync: false means you paste in whatever URL the backend service
      # actually gets assigned (visible in the Render dashboard as soon
      # as that service is created), instead of risking a malformed or
      # wrong URL getting baked into the frontend's build silently.
      #
      # NEXT_PUBLIC_* vars are inlined into the client bundle at BUILD
      # time in Next.js -- if the backend isn't deployed yet (or you
      # change its URL later), rebuild/redeploy the frontend after
      # updating this value, a restart alone won't pick up the change.
      - key: NEXT_PUBLIC_API_URL
        sync: false
